<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>Prismancy title headless render</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
  <canvas id="cv"></canvas>
<script>
const GAME_WIDTH = 960, GAME_HEIGHT = 576, TILE_SIZE = 64;
const SCALE = parseInt((location.hash || '#2').slice(1), 10) || 2;

function makeG(ctx){let fill='rgba(0,0,0,1)',line=null;const rgba=(c,a)=>{const r=(c>>16)&255,g=(c>>8)&255,b=c&255;return`rgba(${r},${g},${b},${a})`;};return{
 fillStyle(c,a=1){fill=rgba(c,a);},lineStyle(w,c,a=1){line=w>0?{width:w,color:rgba(c,a)}:null;},
 fillRect(x,y,w,h){ctx.fillStyle=fill;ctx.fillRect(x,y,w,h);},
 fillCircle(x,y,r){ctx.fillStyle=fill;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();},
 fillEllipse(x,y,w,h){ctx.fillStyle=fill;ctx.beginPath();ctx.ellipse(x,y,w/2,h/2,0,0,Math.PI*2);ctx.fill();},
 strokeEllipse(x,y,w,h){if(!line)return;ctx.strokeStyle=line.color;ctx.lineWidth=line.width;ctx.beginPath();ctx.ellipse(x,y,w/2,h/2,0,0,Math.PI*2);ctx.stroke();},
 fillTriangle(x1,y1,x2,y2,x3,y3){ctx.fillStyle=fill;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.lineTo(x3,y3);ctx.closePath();ctx.fill();},
 fillRoundedRect(x,y,w,h,r){ctx.fillStyle=fill;ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();ctx.fill();},
 fillPoints(p,c){ctx.fillStyle=fill;ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);for(let i=1;i<p.length;i++)ctx.lineTo(p[i].x,p[i].y);if(c)ctx.closePath();ctx.fill();},
};}
function lerpColor(a,b,t){const ar=(a>>16)&255,ag=(a>>8)&255,ab=a&255,br=(b>>16)&255,bg=(b>>8)&255,bb=b&255;return(Math.round(ar+(br-ar)*t)<<16)|(Math.round(ag+(bg-ag)*t)<<8)|Math.round(ab+(bb-ab)*t);}
function quadBezier(p0,p1,p2,t){const u=1-t;return u*u*p0+2*u*t*p1+t*t*p2;}

function paintBackdrop(g){
 const skyTop=0x1a0c2a,skyBottom=0x0e1a16,horizonY=GAME_HEIGHT*0.62,strips=16;
 for(let i=0;i<strips;i++){const t=i/(strips-1);g.fillStyle(lerpColor(skyTop,skyBottom,t),1);const y=(i/strips)*horizonY;g.fillRect(0,y,GAME_WIDTH,Math.ceil(horizonY/strips)+1);}
 const moonX=GAME_WIDTH-240,moonY=GAME_HEIGHT*0.30;
 for(const l of [{r:220,a:0.06,c:0xff7ac0},{r:170,a:0.1,c:0xff7ac0},{r:120,a:0.16,c:0xffaad8},{r:80,a:0.22,c:0xffd0e8},{r:50,a:0.4,c:0xffeaf2}]){g.fillStyle(l.c,l.a);g.fillCircle(moonX,moonY,l.r);}
 g.fillStyle(0x040a0a,1);g.fillRect(0,horizonY-4,GAME_WIDTH,6);
 for(let x=0;x<GAME_WIDTH;x+=18){const h=14+((x*7919)%18);g.fillTriangle(x-4,horizonY,x+12,horizonY,x+4,horizonY-h);}
 g.fillStyle(0x081210,1);g.fillRect(0,horizonY+6,GAME_WIDTH,22);
 for(let x=-10;x<GAME_WIDTH+10;x+=36){const h=36+((x*4421)%28);g.fillRect(x+14,horizonY+6,4,h*0.45);g.fillStyle(0x0a1a18,1);g.fillCircle(x+16,horizonY+6-h*0.2,h*0.28);g.fillCircle(x+6,horizonY+6-h*0.05,h*0.22);g.fillCircle(x+26,horizonY+6,h*0.24);g.fillStyle(0x081210,1);}
 g.fillStyle(0x0e2a22,1);g.fillRect(0,horizonY+20,GAME_WIDTH,GAME_HEIGHT-horizonY);
 g.fillStyle(0x14361a,1);g.fillEllipse(GAME_WIDTH/2,GAME_HEIGHT+60,GAME_WIDTH*1.4,220);
 g.fillStyle(0x1f4a26,1);g.fillEllipse(GAME_WIDTH/2,GAME_HEIGHT+100,GAME_WIDTH*1.3,200);
 g.fillStyle(0xc0eadd,0.06);g.fillRect(0,horizonY+26,GAME_WIDTH,14);
 g.fillStyle(0xc0eadd,0.08);g.fillRect(0,horizonY+44,GAME_WIDTH,8);
 const fly=(x,y,s,c,a)=>{g.fillStyle(0x040a05,1);g.fillCircle(x,y,s+0.8);g.fillStyle(c,a);g.fillCircle(x,y,s);g.fillStyle(0xffffff,a*0.9);g.fillRect(x,y-1,1,1);};
 for(const[fx,fy,fr]of[[120,220,2],[380,180,1.6],[460,260,2.2],[560,200,1.8],[680,350,1.6],[820,240,2],[180,380,1.4],[340,460,2],[580,480,1.8],[780,460,1.6],[880,380,2],[80,320,1.5]])fly(fx,fy,fr,0x88c060,1);
 fly(GAME_WIDTH-320,200,1.6,0xff7ac0,1);fly(GAME_WIDTH-180,240,2,0xff7ac0,1);fly(GAME_WIDTH-280,360,1.4,0xffaad8,1);
}
function paintQueenHalo(g){const x=GAME_WIDTH-240,y=GAME_HEIGHT/2-30;g.fillStyle(0xff7ac0,0.14);g.fillCircle(x,y,180);g.fillStyle(0xff7ac0,0.18);g.fillCircle(x,y,130);g.fillStyle(0xffaad8,0.18);g.fillCircle(x,y,90);}
function paintWizardAura(g){const x=240,y=GAME_HEIGHT/2+60;g.fillStyle(0x88c060,0.12);g.fillEllipse(x,y+110,220,60);g.fillStyle(0x4ea656,0.18);g.fillEllipse(x,y+110,160,40);g.fillStyle(0xb0e890,0.22);g.fillEllipse(x,y+110,100,24);}
function paintActionEffects(g){
 const wx=300,wy=GAME_HEIGHT/2+10,qx=GAME_WIDTH-270,qy=GAME_HEIGHT/2-20;
 const cX=(wx+qx)/2,cY=Math.min(wy,qy)-80,beads=6;
 for(let i=0;i<beads;i++){const t=(i+1)/(beads+1),px=quadBezier(wx,cX,qx,t),py=quadBezier(wy,cY,qy,t),al=0.4+(i/(beads-1))*0.55,r=3+(i/(beads-1))*5;g.fillStyle(0xc0eaff,al*0.4);g.fillCircle(px,py,r*1.6);g.fillStyle(0xeaffff,al);g.fillCircle(px,py,r);g.fillStyle(0xffffff,al);g.fillRect(px,py-1,1,1);}
 for(const[tx,ty]of[[GAME_WIDTH-360,GAME_HEIGHT/2-80],[GAME_WIDTH-460,GAME_HEIGHT/2+20],[GAME_WIDTH-560,GAME_HEIGHT/2+100]]){g.fillStyle(0x040408,1);g.fillTriangle(tx+12,ty-5,tx+12,ty+5,tx-6,ty);g.fillStyle(0xff7ac0,1);g.fillTriangle(tx+10,ty-3,tx+10,ty+3,tx-4,ty);g.fillStyle(0xffaad8,0.5);g.fillRect(tx+12,ty-1,24,2);g.fillStyle(0xffaad8,0.25);g.fillRect(tx+36,ty-1,28,2);}
}
const WIZ={OUT:0x1a0828,HAT_DARK:0x3a0f70,HAT_HI:0x7a3fbe,SKIN:0xf0c89a,ROBE:0x7a2cb8,ROBE_HI:0x9a4cd8,BEARD:0xe8e8e8,BEARD_SHADOW:0xa8a8a8,BUCKLE:0xffd84a,WAND:0xc89758,TIP:0xffd84a,SHADOW:0x3a2a4a,BOOT:0x2a1a0d,EYE:0x222222,TIP_SPARKLE:0xfff8c0};
function drawWizard(g,p){const size=TILE_SIZE,cx=size/2,top=10,figBot=53;
 g.fillStyle(p.SHADOW,0.45);g.fillEllipse(cx,figBot,14,2);
 g.fillStyle(p.OUT,1);g.fillPoints([{x:cx-6,y:top+19},{x:cx+6,y:top+19},{x:cx+11,y:top+38},{x:cx,y:top+41},{x:cx-11,y:top+38}],true);
 g.fillStyle(p.ROBE,1);g.fillPoints([{x:cx-5,y:top+20},{x:cx+5,y:top+20},{x:cx+9,y:top+37},{x:cx,y:top+39.5},{x:cx-9,y:top+37}],true);
 g.fillStyle(p.ROBE_HI,0.7);g.fillEllipse(cx-3,top+25,3,7);
 g.fillStyle(p.OUT,1);g.fillRoundedRect(cx-8,top+30,16,4,1.5);g.fillStyle(p.BUCKLE,1);g.fillRect(cx-2,top+31,4,2);
 g.fillStyle(p.OUT,1);g.fillEllipse(cx-3,top+42,5,3);g.fillEllipse(cx+3,top+42,5,3);g.fillStyle(p.BOOT,1);g.fillEllipse(cx-3,top+41.5,3.5,2);g.fillEllipse(cx+3,top+41.5,3.5,2);
 g.fillStyle(p.OUT,1);g.fillEllipse(cx,top+17,10,9);g.fillStyle(p.BEARD,1);g.fillEllipse(cx,top+17,8,7);g.fillStyle(p.BEARD_SHADOW,0.5);g.fillEllipse(cx+2,top+19,2.5,3);
 g.fillStyle(p.OUT,1);g.fillEllipse(cx,top+12,9,6);g.fillStyle(p.SKIN,1);g.fillEllipse(cx,top+12,7,4.4);g.fillStyle(p.EYE,1);g.fillCircle(cx-2,top+11.5,1.1);g.fillCircle(cx+2,top+11.5,1.1);g.fillStyle(0xffffff,0.9);g.fillRect(cx-2,top+11,1,1);g.fillRect(cx+2,top+11,1,1);
 g.fillStyle(p.OUT,1);g.fillPoints([{x:cx,y:top-1},{x:cx+9,y:top+12},{x:cx,y:top+11},{x:cx-9,y:top+12}],true);
 g.fillStyle(p.HAT_DARK,1);g.fillPoints([{x:cx,y:top+1},{x:cx+7.5,y:top+11},{x:cx,y:top+10},{x:cx-7.5,y:top+11}],true);
 g.fillStyle(p.HAT_HI,0.7);g.fillTriangle(cx-1,top+2,cx+0.5,top+2,cx-3.5,top+9);
 g.fillStyle(p.OUT,1);g.fillCircle(cx,top-2,1.9);g.fillStyle(p.BUCKLE,1);g.fillCircle(cx,top-2,1.2);
 g.fillStyle(p.OUT,1);g.fillTriangle(cx+2,top+30,cx+11,top+16,cx+12.5,top+19);g.fillStyle(p.WAND,1);g.fillTriangle(cx+3,top+30.5,cx+10.5,top+17,cx+11.5,top+19);
 g.fillStyle(p.OUT,1);g.fillCircle(cx+6,top+26,2);g.fillStyle(p.SKIN,1);g.fillCircle(cx+6,top+26,1.3);
 g.fillStyle(p.TIP_SPARKLE,0.45);g.fillCircle(cx+11,top+16,4);g.fillStyle(p.OUT,1);g.fillCircle(cx+11,top+16,2.4);g.fillStyle(p.TIP,1);g.fillCircle(cx+11,top+16,1.5);g.fillStyle(p.TIP_SPARKLE,1);g.fillRect(cx+10,top+15,1,1);
 g.fillStyle(0x000000,0.45);g.fillEllipse(cx,figBot+2,18,2.8);
}
function drawPixieQueen(g){const size=64,cx=size/2,cy=size/2;
 g.fillStyle(0xff7ac0,0.2);g.fillCircle(cx,cy,cx);g.fillStyle(0xffaad8,0.3);g.fillCircle(cx,cy,cx-10);
 const wing=(sx,sy,wW,wH,f)=>{g.lineStyle(1,0xa84080,0.7);g.fillStyle(f,0.55);g.fillEllipse(sx,sy,wW,wH);g.strokeEllipse(sx,sy,wW,wH);};
 wing(cx-12,cy-6,15,11,0xffd0e8);wing(cx+12,cy-6,15,11,0xffd0e8);wing(cx-14,cy+6,14,10,0xfff8a0);wing(cx+14,cy+6,14,10,0xfff8a0);g.lineStyle(0,0,0);
 g.fillStyle(0x4d0d22,1);g.fillEllipse(cx,cy+4,18,22);g.fillStyle(0xb02468,1);g.fillEllipse(cx,cy+5,15,18);g.fillStyle(0xff5b86,1);g.fillEllipse(cx,cy+1,12,13);g.fillStyle(0xff90a8,1);g.fillEllipse(cx-2.5,cy-1,3.5,5);
 g.fillStyle(0x4d0d22,1);g.fillCircle(cx,cy-10,7);g.fillStyle(0xfde68a,1);g.fillCircle(cx,cy-10,5.5);
 g.fillStyle(0x4a1a08,1);g.fillEllipse(cx,cy-14,13,5);g.fillStyle(0xa64a1a,1);g.fillEllipse(cx,cy-14.5,8,2.4);
 const crownY=cy-18;g.fillStyle(0x664000,1);g.fillRect(cx-7,crownY,14,4);g.fillStyle(0xffd84a,1);g.fillRect(cx-6,crownY+1,12,3);
 g.fillStyle(0x664000,1);g.fillTriangle(cx-7,crownY,cx-4,crownY-4,cx-1,crownY);g.fillTriangle(cx-2,crownY,cx,crownY-5,cx+2,crownY);g.fillTriangle(cx+1,crownY,cx+4,crownY-4,cx+7,crownY);
 g.fillStyle(0xffd84a,1);g.fillTriangle(cx-6,crownY,cx-4,crownY-3,cx-2,crownY);g.fillTriangle(cx-1,crownY,cx,crownY-4,cx+1,crownY);g.fillTriangle(cx+2,crownY,cx+4,crownY-3,cx+6,crownY);
 g.fillStyle(0xff5577,1);g.fillCircle(cx,crownY-3,1.4);g.fillStyle(0xffffff,1);g.fillRect(cx,crownY-4,1,1);
 g.fillStyle(0x111111,1);g.fillCircle(cx-2.4,cy-10,1.5);g.fillCircle(cx+2.4,cy-10,1.5);g.fillStyle(0xffffff,0.95);g.fillCircle(cx-2.9,cy-10.6,0.7);g.fillCircle(cx+1.9,cy-10.6,0.7);
 g.fillStyle(0xff9ab0,0.5);g.fillCircle(cx-3.6,cy-8.2,1.2);g.fillCircle(cx+3.6,cy-8.2,1.2);
 g.fillStyle(0xa83048,1);g.fillRect(cx-2,cy-7,1,1);g.fillRect(cx-1,cy-6,1,1);g.fillRect(cx,cy-6,1,1);g.fillRect(cx+1,cy-6,1,1);g.fillRect(cx+2,cy-7,1,1);
 const star=(sx,sy,c)=>{g.fillStyle(c,1);g.fillRect(sx,sy,1,1);g.fillRect(sx-1,sy,1,1);g.fillRect(sx+1,sy,1,1);g.fillRect(sx,sy-1,1,1);g.fillRect(sx,sy+1,1,1);};
 star(cx-26,cy-14,0xffffff);star(cx+25,cy-8,0xfff8a0);star(cx-24,cy+12,0xfff8a0);star(cx+26,cy+14,0xffffff);star(cx+22,cy-22,0xffffff);star(cx-22,cy+22,0xfff8a0);star(cx,cy-26,0xffffff);
}
function makeSprite(fn){const c=document.createElement('canvas');c.width=64;c.height=64;fn(makeG(c.getContext('2d')));return c;}
function blit(ctx,off,x,y,s,rot){ctx.save();ctx.imageSmoothingEnabled=false;ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);ctx.drawImage(off,-off.width/2,-off.height/2);ctx.restore();}

const cv=document.getElementById('cv');
cv.width=GAME_WIDTH*SCALE;cv.height=GAME_HEIGHT*SCALE;
const ctx=cv.getContext('2d');const g=makeG(ctx);
const wizardSprite=makeSprite(x=>drawWizard(x,WIZ));
const queenSprite=makeSprite(drawPixieQueen);
ctx.setTransform(SCALE,0,0,SCALE,0,0);paintBackdrop(g);paintQueenHalo(g);
ctx.setTransform(1,0,0,1,0,0);blit(ctx,queenSprite,(GAME_WIDTH-240)*SCALE,(GAME_HEIGHT/2-30)*SCALE,4*SCALE,0.08);
ctx.setTransform(SCALE,0,0,SCALE,0,0);paintWizardAura(g);
ctx.setTransform(1,0,0,1,0,0);blit(ctx,wizardSprite,240*SCALE,(GAME_HEIGHT/2+60)*SCALE,4*SCALE,-0.08);
ctx.setTransform(SCALE,0,0,SCALE,0,0);paintActionEffects(g);
ctx.setTransform(1,0,0,1,0,0);
document.title='READY';
</script>
</body>
</html>
